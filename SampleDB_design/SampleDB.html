<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SampleDB — Redesign</title>
  <style>/* ===========================================================
   SampleDB Redesign — Shared app shell + direction skins
   =========================================================== */
/* =============================================================
   SampleDB Design System — Colors & Type
   Lifted from colnio/sampleDB static/css/style.css
   ============================================================= */

@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
    /* ---------- Type ---------- */
    --font-family-base: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    --font-family-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;

    --font-size-xs: 0.75rem;    /* 12px */
    --font-size-sm: 0.875rem;   /* 14px */
    --font-size-base: 1rem;     /* 16px */
    --font-size-lg: 1.125rem;   /* 18px */
    --font-size-xl: 1.25rem;    /* 20px */
    --font-size-2xl: 1.5rem;    /* 24px */
    --font-size-3xl: 1.875rem;  /* 30px */

    --line-height-tight: 1.2;
    --line-height-heading: 1.3;
    --line-height-body: 1.65;

    /* ---------- Spacing ---------- */
    --space-xs: 0.25rem;   /* 4  */
    --space-sm: 0.5rem;    /* 8  */
    --space-md: 1rem;      /* 16 */
    --space-lg: 1.5rem;    /* 24 */
    --space-xl: 2rem;      /* 32 */
    --space-2xl: 3rem;     /* 48 */

    /* ---------- Radius ---------- */
    --radius-sm: 6px;
    --radius-md: 12px;
    --radius-pill: 9999px;

    /* ---------- Elevation ---------- */
    --card-shadow: 0 6px 20px rgba(17, 24, 39, 0.1);
    --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 12px 30px rgba(15, 23, 42, 0.18);

    /* ---------- Surfaces ---------- */
    --surface-default: #ffffff;
    --surface-subtle:  #f8fafc;
    --surface-muted:   #f1f5f9;

    /* ---------- Neutrals (slate ramp) ---------- */
    --neutral-950: #0b1120;
    --neutral-900: #111827;
    --neutral-800: #1f2937;
    --neutral-700: #334155;
    --neutral-600: #475569;
    --neutral-500: #64748b;
    --neutral-400: #94a3b8;
    --neutral-200: #e2e8f0;
    --neutral-100: #f1f5f9;
    --neutral-50:  #f8fafc;

    /* ---------- Accent (flask blue) ---------- */
    --accent-100: #e8f1ff;
    --accent-200: #cfe0ff;
    --accent-400: #5992ff;
    --accent-500: #2563eb;  /* primary */
    --accent-600: #1d4ed8;
    --accent-700: #1e40af;

    /* ---------- Borders ---------- */
    --border-subtle: rgba(15, 23, 42, 0.1);
    --border-strong: rgba(15, 23, 42, 0.18);

    /* ---------- Semantic text ---------- */
    --text-strong: var(--neutral-900);
    --text-muted:  var(--neutral-600);
    --text-on-accent: #ffffff;

    /* ---------- Semantic colors ---------- */
    --color-primary:         var(--accent-500);
    --color-primary-hover:   var(--accent-600);
    --color-primary-active:  var(--accent-700);
    --color-secondary-bg:    var(--accent-100);
    --color-secondary-border: var(--accent-200);
    --color-secondary-hover-bg: var(--accent-200);
    --color-secondary-hover-border: var(--accent-400);
    --color-secondary-text:  var(--accent-700);

    --color-destructive:        #b91c1c;
    --color-destructive-hover:  #991b1b;
    --color-destructive-active: #7f1d1d;
    --color-destructive-bg:     #fef2f2;
    --color-destructive-border: #fecaca;

    --color-success:        #047857;
    --color-success-bg:     #ecfdf5;
    --color-success-border: #bbf7d0;

    --color-button-on-dark:         #ffffff;
    --color-button-disabled-bg:     #e5e7eb;
    --color-button-disabled-border: #d1d5db;
    --color-button-disabled-text:   #9ca3af;
    --color-button-focus:           rgba(37, 99, 235, 0.35);

    --theme-color-scheme: light;
}

:root[data-theme="dark"] {
    --theme-color-scheme: dark;
    --surface-default: #161b22;
    --surface-subtle:  #0d1117;
    --surface-muted:   #151b23;

    --neutral-950: #f0f6fc;
    --neutral-900: #c9d1d9;
    --neutral-800: #aab6c3;
    --neutral-700: #9198a1;
    --neutral-600: #7d8590;
    --neutral-500: #6e7681;
    --neutral-400: #484f58;
    --neutral-200: #30363d;
    --neutral-100: #21262d;
    --neutral-50:  #151b23;

    --accent-100: #0c2d6b;
    --accent-200: #1158c7;
    --accent-400: #1f6feb;
    --accent-500: #4493f8;
    --accent-600: #58a6ff;
    --accent-700: #79c0ff;

    --card-shadow: 0 8px 24px rgba(1, 4, 9, 0.65);
    --border-subtle: #30363d;
    --border-strong: #484f58;
    --text-strong: #f0f6fc;
    --text-muted:  #9198a1;

    --color-primary:        #4493f8;
    --color-primary-hover:  #58a6ff;
    --color-primary-active: #1f6feb;

    --color-destructive:        #f0883e;
    --color-destructive-hover:  #ffa657;
    --color-destructive-active: #bd561d;
}

/* =============================================================
   Semantic element styling
   ============================================================= */
body {
    font-family: var(--font-family-base);
    font-size: var(--font-size-base);
    line-height: var(--line-height-body);
    color: var(--text-strong);
    background: var(--surface-subtle);
}

h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-family-base);
    line-height: var(--line-height-heading);
    font-weight: 700;
    margin: 0 0 var(--space-sm);
    color: var(--text-strong);
}
h1, h2 { color: var(--color-primary); }
h1 { font-size: var(--font-size-3xl); margin-bottom: var(--space-lg); }
h2 { font-size: var(--font-size-2xl); }
h3 { font-size: var(--font-size-xl); }
h4 { font-size: var(--font-size-lg); }
h5 { font-size: var(--font-size-base); }
h6 {
    font-size: var(--font-size-sm);
    letter-spacing: 0.04em;
    text-transform: uppercase;
}
p { margin: 0 0 var(--space-md); }
code, pre {
    font-family: var(--font-family-mono);
    font-size: 0.9em;
}
code {
    padding: 0.2em 0.4em;
    background: rgba(27, 31, 35, 0.05);
    border-radius: var(--radius-sm);
}

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap');

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-family-base);
  font-size: var(--font-size-base);
  line-height: var(--line-height-body);
  color: var(--text-strong);
  background: var(--surface-subtle);
  min-height: 100vh;
}

a { color: var(--color-primary); text-decoration: none; }
a:hover { color: var(--color-primary-hover); }

button { font-family: inherit; }

/* ---------- Top-level direction switcher ---------- */
.direction-bar {
  position: sticky; top: 0; z-index: 200;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  background: rgba(13, 17, 23, 0.92);
  color: #fff;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  font-size: 13px;
}
.direction-bar__label { font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.7; font-size: 11px; }
.direction-bar__segs { display: inline-flex; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 999px; padding: 3px; }
.direction-bar__seg { padding: 6px 14px; border-radius: 999px; background: transparent; border: none; color: rgba(255,255,255,0.7); font-weight: 600; font-size: 12px; cursor: pointer; letter-spacing: 0.02em; }
.direction-bar__seg.active { background: #fff; color: #0d1117; }
.direction-bar__screens { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; }
.direction-bar__screens button {
  padding: 5px 11px; border-radius: 6px; background: transparent; border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.8); font-size: 11.5px; font-weight: 500; cursor: pointer;
}
.direction-bar__screens button.active { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.25); }
.direction-bar__theme {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #fff; cursor: pointer;
  font-size: 12px; font-weight: 600;
}

/* stage */
.stage { min-height: calc(100vh - 50px); }
.stage[data-dir="A"] { background: var(--surface-subtle); }
.stage[data-dir="B"] { background: var(--surface-subtle); }
.stage[data-dir="C"] { background: var(--surface-subtle); }

/* ---------- Shared small tokens ---------- */
.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 20px; padding: 0 5px;
  border: 1px solid var(--border-subtle); border-bottom-width: 2px;
  border-radius: 5px; background: var(--surface-default);
  font-family: var(--font-family-mono); font-size: 11px; color: var(--text-muted);
}

.status-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em;
  border: 1px solid transparent;
}
.status-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-chip--active { background: var(--color-success-bg); color: var(--color-success); border-color: var(--color-success-border); }
.status-chip--progress { background: rgba(37,99,235,0.08); color: var(--color-primary); border-color: rgba(37,99,235,0.2); }
.status-chip--archived { background: var(--surface-muted); color: var(--text-muted); border-color: var(--border-subtle); }
.status-chip--pending { background: #fef3c7; color: #92400e; border-color: #fde68a; }
:root[data-theme="dark"] .status-chip--pending { background: rgba(251,191,36,0.12); color: #fbbf24; border-color: rgba(251,191,36,0.3); }

/* ---------- Utilities ---------- */
.u-flex { display: flex; }
.u-between { display:flex; align-items:center; justify-content:space-between; }
.u-center { display:flex; align-items:center; }
.u-gap-sm { gap: 8px; }
.u-gap-md { gap: 16px; }
.u-gap-lg { gap: 24px; }
.u-muted { color: var(--text-muted); }
.u-mono { font-family: var(--font-family-mono); }
.u-small { font-size: 13px; }
.u-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }

/* ===========================================================
   DIRECTION A — Refined (keeps blue + 3px top bar, app shell)
   =========================================================== */
.dirA {
  --a-sidebar-w: 240px;
}
.dirA .app-shell { display: grid; grid-template-columns: var(--a-sidebar-w) 1fr; min-height: calc(100vh - 50px); }
.dirA .sidebar {
  background: var(--surface-default);
  border-right: 1px solid var(--border-subtle);
  display: flex; flex-direction: column;
  padding: 20px 14px;
  gap: 4px;
}
.dirA .sidebar__brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px; font-weight: 800; font-size: 17px; color: var(--color-primary); }
.dirA .sidebar__brand svg { width: 26px; height: 26px; }
.dirA .nav-group { margin-top: 16px; }
.dirA .nav-group__title { padding: 8px 10px; font-size: 10.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
.dirA .nav-link {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 8px;
  color: var(--neutral-700); font-size: 14px; font-weight: 500;
  border: none; background: transparent; width: 100%; text-align: left; cursor: pointer;
}
.dirA .nav-link svg { width: 18px; height: 18px; stroke: currentColor; flex: none; }
.dirA .nav-link:hover { background: rgba(37,99,235,0.08); color: var(--color-primary); }
.dirA .nav-link.active { background: rgba(37,99,235,0.12); color: var(--color-primary); font-weight: 600; box-shadow: inset 3px 0 0 var(--color-primary); }
.dirA .nav-link .count { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--text-muted); background: var(--surface-muted); padding: 1px 7px; border-radius: 999px; }
.dirA .sidebar__footer { margin-top: auto; padding: 10px; border-top: 1px solid var(--border-subtle); display:flex; align-items:center; gap: 10px; }
.dirA .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--color-secondary-bg); color: var(--color-secondary-text); display:flex; align-items:center; justify-content:center; font-weight: 700; font-size: 13px; }

.dirA .main { padding: 28px 40px 80px; max-width: 1400px; }
.dirA .topbar { display:flex; align-items:center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
.dirA .topbar__left h1 { font-size: 24px; color: var(--text-strong); margin: 0 0 4px; }
.dirA .topbar__left .crumbs { font-size: 12.5px; color: var(--text-muted); }
.dirA .topbar__actions { display: flex; gap: 10px; align-items: center; }

.dirA .card {
  background: var(--surface-default);
  border: 1px solid var(--border-subtle);
  border-top: 3px solid var(--color-primary);
  border-radius: 12px;
  box-shadow: var(--card-shadow);
}
.dirA .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 13.5px;
  border: 1px solid transparent; cursor: pointer; min-height: 38px;
  transition: transform 0.1s, background 0.15s, border-color 0.15s;
}
.dirA .btn:active { transform: translateY(1px); }
.dirA .btn svg { width: 16px; height: 16px; flex: none; }
.dirA .btn--primary { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
.dirA .btn--primary:hover { background: var(--color-primary-hover); }
.dirA .btn--secondary { background: var(--color-secondary-bg); color: var(--color-secondary-text); border-color: var(--color-secondary-border); }
.dirA .btn--ghost { background: transparent; color: var(--text-strong); border-color: var(--border-subtle); }
.dirA .btn--ghost:hover { background: var(--surface-muted); }
.dirA .btn--danger { background: transparent; color: var(--color-destructive); border-color: var(--color-destructive-border); }
.dirA .btn--sm { padding: 6px 12px; min-height: 30px; font-size: 12.5px; }
.dirA .btn--icon { width: 38px; padding: 0; }

.dirA .toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 14px; background: var(--surface-default); border: 1px solid var(--border-subtle);
  border-radius: 12px; margin-bottom: 20px;
}
.dirA .search {
  flex: 1; min-width: 240px; display:flex; align-items:center; gap:8px;
  padding: 0 12px; background: var(--surface-subtle);
  border: 1px solid var(--border-subtle); border-radius: 8px; min-height: 38px;
}
.dirA .search input { background: transparent; border: none; outline: none; flex: 1; font-size: 14px; color: var(--text-strong); min-height: auto; padding: 0; }
.dirA .search svg { color: var(--text-muted); width: 16px; height: 16px; }

.dirA .filter-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px;
  background: var(--surface-subtle); border: 1px dashed var(--border-subtle);
  font-size: 12.5px; font-weight: 500; color: var(--text-muted); cursor: pointer;
}
.dirA .filter-chip.active { background: var(--color-secondary-bg); color: var(--color-secondary-text); border: 1px solid var(--color-secondary-border); }

.dirA .seg {
  display: inline-flex; padding: 3px; border-radius: 8px; background: var(--surface-muted); border: 1px solid var(--border-subtle);
}
.dirA .seg button { padding: 5px 12px; border-radius: 6px; background: transparent; border: none; font-size: 12.5px; color: var(--text-muted); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.dirA .seg button svg { width: 14px; height: 14px; }
.dirA .seg button.active { background: var(--surface-default); color: var(--text-strong); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

.dirA .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
.dirA .stat-card { padding: 16px 18px; background: var(--surface-default); border: 1px solid var(--border-subtle); border-top: 3px solid var(--color-primary); border-radius: 12px; }
.dirA .stat-card__label { font-size: 12px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.dirA .stat-card__value { font-size: 28px; font-weight: 800; color: var(--text-strong); margin: 4px 0 2px; letter-spacing: -0.02em; }
.dirA .stat-card__delta { font-size: 12px; color: var(--color-success); font-weight: 600; }
.dirA .stat-card__delta.down { color: var(--color-destructive); }

.dirA .samples-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.dirA .sample-card { overflow: hidden; padding: 0; display:flex; flex-direction:column; cursor: pointer; transition: transform 0.18s, box-shadow 0.18s; }
.dirA .sample-card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(17,24,39,0.12); }
.dirA .sample-card__thumb { height: 140px; background: linear-gradient(135deg, #1e3a8a, #3b82f6); position: relative; overflow: hidden; }
.dirA .sample-card__thumb .status { position: absolute; top: 10px; right: 10px; z-index: 2; background: rgba(13,17,23,0.8); color: #fff; border: 1px solid rgba(255,255,255,0.15); }
.dirA .sample-card__body { padding: 14px 16px 16px; display:flex; flex-direction:column; gap: 6px; flex: 1; }
.dirA .sample-card__id { font-family: var(--font-family-mono); font-size: 11.5px; color: var(--text-muted); letter-spacing: 0.04em; }
.dirA .sample-card__title { font-size: 16px; font-weight: 700; color: var(--text-strong); margin: 0; }
.dirA .sample-card__desc { font-size: 13px; color: var(--text-muted); margin: 2px 0 6px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dirA .sample-card__meta { display:flex; gap: 12px; font-size: 12px; color: var(--text-muted); margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border-subtle); }

.dirA .data-table { width: 100%; background: var(--surface-default); border: 1px solid var(--border-subtle); border-radius: 12px; overflow: hidden; border-collapse: collapse; }
.dirA .data-table th { text-align: left; padding: 11px 16px; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; background: var(--surface-subtle); border-bottom: 1px solid var(--border-subtle); }
.dirA .data-table td { padding: 12px 16px; font-size: 13.5px; border-bottom: 1px solid var(--border-subtle); color: var(--text-strong); vertical-align: middle; }
.dirA .data-table tr:last-child td { border-bottom: none; }
.dirA .data-table tr:hover td { background: var(--surface-subtle); }
.dirA .data-table .sample-id { font-family: var(--font-family-mono); font-size: 12.5px; color: var(--color-primary); font-weight: 600; }

.dirA .form-card { padding: 24px; }
.dirA .field { margin-bottom: 16px; }
.dirA .field label { display:block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-strong); }
.dirA .field input, .dirA .field textarea, .dirA .field select {
  width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border-subtle);
  background: var(--surface-default); color: var(--text-strong); font-size: 14px; font-family: inherit;
  min-height: 38px;
}
.dirA .field input:focus, .dirA .field textarea:focus, .dirA .field select:focus {
  outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
}
.dirA .field textarea { min-height: 80px; resize: vertical; }
.dirA .field-help { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.dirA .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* Activity */
.dirA .activity-item { display:flex; gap: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
.dirA .activity-item:hover { background: var(--surface-subtle); }
.dirA .activity-item .time { color: var(--text-muted); font-size: 12px; margin-left: auto; white-space: nowrap; font-family: var(--font-family-mono); }
.dirA .activity-item .dot-col { flex: none; width: 8px; display:flex; justify-content: center; padding-top: 6px; position: relative; }
.dirA .activity-item .dot-col::before { content: ''; position: absolute; top: 0; left: 50%; bottom: -10px; width: 1px; background: var(--border-subtle); }
.dirA .activity-item:last-child .dot-col::before { display: none; }
.dirA .activity-item .dot-col::after { content: ''; position: absolute; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--color-primary); }

/* fabrication timeline — A */
.dirA .fab-timeline { position: relative; padding-left: 6px; }
.dirA .fab-step { display: grid; grid-template-columns: 44px 1fr; gap: 14px; padding: 14px 0; border-bottom: 1px dashed var(--border-subtle); position: relative; }
.dirA .fab-step:last-child { border-bottom: none; }
.dirA .fab-step__num {
  width: 36px; height: 36px; border-radius: 10px; background: var(--color-secondary-bg); color: var(--color-secondary-text);
  font-weight: 700; display:flex; align-items:center; justify-content:center; font-family: var(--font-family-mono); font-size: 14px;
}
.dirA .fab-step__title { font-weight: 600; font-size: 14px; margin-bottom: 4px; display:flex; align-items:center; gap: 8px; }

/* booking */

// Abstract sample thumbnail
function SampleThumb({ seed = 1, palette = 'blue', style }) {
  const s = (seed * 12345) % 1000;
  const rand = (n) => ((s * (n + 1) * 9301 + 49297) % 233280) / 233280;
  const palettes = {
    blue: ['#0c4a6e','#0369a1','#38bdf8','#bae6fd'],
    teal: ['#134e4a','#0e7c66','#5eead4','#ccfbf1'],
    violet: ['#3b0764','#7c3aed','#c4b5fd','#ede9fe'],
    amber: ['#78350f','#d97706','#fbbf24','#fef3c7'],
    emerald:['#064e3b','#047857','#34d399','#d1fae5'],
    rose: ['#881337','#e11d48','#fb7185','#ffe4e6'],
  };
  const P = palettes[palette] || palettes.blue;
  const shapes = Array.from({ length: 22 }, (_, i) => ({
    cx: 10 + rand(i) * 380,
    cy: 10 + rand(i * 3) * 160,
    r:  3 + rand(i * 5) * 34,
    c:  P[Math.floor(rand(i*7)*P.length)],
    o:  0.25 + rand(i * 11) * 0.55,
  }));
  return (
    <svg viewBox="0 0 400 180" preserveAspectRatio="xMidYMid slice" style={{ width: '100%', height: '100%', display: 'block', ...style }}>
      <defs>
        <radialGradient id={`g${seed}-${palette}`} cx="30%" cy="30%" r="90%">
          <stop offset="0%" stopColor={P[2]} stopOpacity="0.6"/>
          <stop offset="100%" stopColor={P[0]} stopOpacity="1"/>
        </radialGradient>
      </defs>
      <rect width="400" height="180" fill={`url(#g${seed}-${palette})`}/>
      {shapes.map((c, i) => (
        <circle key={i} cx={c.cx} cy={c.cy} r={c.r} fill={c.c} opacity={c.o} />
      ))}
    </svg>
  );
}

  <script type="text/babel" data-presets="react">
// Main App — depends on window.Ic, window.DirectionA/B/C
const { useState: useStateA, useEffect: useEffectA } = React;

const SCREENS = [
  ['login','Login'], ['dashboard','Dashboard'], ['samples','Samples'],
  ['detail','Sample'], ['new','New Sample'],
  ['wiki','Wiki'], ['wikiArticle','Article'],
  ['booking','Booking'], ['tokens','Tokens'], ['admin','Admin'],
];

function LoginScreen({ dir, setScreen, theme }) {
  const accent = dir==='A' ? '#2563eb' : dir==='B' ? '#6366f1' : '#0e7c66';
  const isDark = theme === 'dark';
  const bg = isDark ? '#0d1117' : '#f8fafc';
  const panel = isDark ? '#161b22' : '#ffffff';
  const text = isDark ? '#e8e8e8' : '#0b1120';
  const muted = isDark ? '#9ca3a4' : '#64748b';
  const inputBg = isDark ? '#0d1117' : '#ffffff';
  const inputBrd = isDark ? 'rgba(255,255,255,0.12)' : 'rgba(15,23,42,0.12)';
  return (
    <div style={{minHeight:'calc(100vh - 50px)', background: bg, display:'flex', alignItems:'center', justifyContent:'center', padding: 24, fontFamily: dir==='C' ? '"Fraunces", Georgia, serif' : 'Inter, -apple-system, sans-serif'}}>
      <div style={{width: 460, background: panel, borderRadius: 16, padding: 36, boxShadow: isDark ? '0 20px 60px rgba(0,0,0,0.45)' : '0 20px 60px rgba(15,23,42,0.12)', border: `1px solid ${inputBrd}`, borderTop: dir==='A' ? `3px solid ${accent}` : `1px solid ${inputBrd}`}}>
        <div style={{display:'flex', alignItems:'center', gap: 12, marginBottom: 6}}>
          <Ic.Flask style={{width: 34, height: 34, color: accent}}/>
          <div>
            <div style={{fontWeight: 800, fontSize: 18, color: text, letterSpacing: '-0.01em'}}>SampleDB</div>
            <div style={{fontSize: 11, color: muted, fontFamily: '"JetBrains Mono", monospace', textTransform:'uppercase', letterSpacing:'0.1em'}}>Lab portal · v2</div>
          </div>
        </div>
        <h1 style={{fontSize: 32, fontWeight: 800, color: accent, margin: '26px 0 6px', letterSpacing: '-0.02em'}}>Welcome back</h1>
        <p style={{color: muted, fontSize: 14, margin: '0 0 26px', lineHeight: 1.55}}>Sign in to manage samples, wiki pages, and equipment bookings.</p>
        <div style={{display:'flex', flexDirection:'column', gap: 14}}>
          <div>
            <label style={{fontSize: 11, fontWeight: 700, color: muted, display:'block', marginBottom: 8, textTransform:'uppercase', letterSpacing: '0.08em'}}>Username</label>
            <input defaultValue="msmith" style={{width:'100%', padding: '11px 14px', borderRadius: 8, border: `1px solid ${inputBrd}`, background: inputBg, color: text, fontSize: 14, fontFamily:'inherit', boxSizing:'border-box'}}/>
          </div>
          <div>
            <label style={{fontSize: 11, fontWeight: 700, color: muted, display:'block', marginBottom: 8, textTransform:'uppercase', letterSpacing: '0.08em'}}>Password</label>
            <input type="password" defaultValue="passpasspass" style={{width:'100%', padding: '11px 14px', borderRadius: 8, border: `1px solid ${inputBrd}`, background: inputBg, color: text, fontSize: 14, fontFamily:'inherit', boxSizing:'border-box'}}/>
          </div>
          <button onClick={()=>setScreen('dashboard')} style={{padding: '13px', borderRadius: 8, background: accent, color: '#fff', border: 'none', fontSize: 14, fontWeight: 700, cursor:'pointer', marginTop: 8, letterSpacing: '-0.01em'}}>Sign in →</button>
        </div>
        <div style={{textAlign:'center', marginTop: 22, fontSize: 13, color: muted}}>Need an account? <a style={{color: accent, fontWeight: 600, cursor:'pointer'}}>Request access</a></div>
      </div>
    </div>
  );
}

function App() {
  const [dir, setDir] = useStateA(() => localStorage.getItem('sdb_dir') || 'A');
  const [screen, setScreen] = useStateA(() => localStorage.getItem('sdb_screen') || 'dashboard');
  const [theme, setTheme] = useStateA(() => localStorage.getItem('sdb_theme') || 'dark');
  const [activeSample, setActiveSample] = useStateA(null);

  useEffectA(() => { localStorage.setItem('sdb_dir', dir); }, [dir]);
  useEffectA(() => { localStorage.setItem('sdb_screen', screen); }, [screen]);
  useEffectA(() => {
    localStorage.setItem('sdb_theme', theme);
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  const directionLabels = { A:'Refined', B:'Dense', C:'Editorial' };
  const directionSubs   = { A:'Classic blue, app shell, polished', B:'Linear-inspired, dense, table-first', C:'Lab notebook, serif + teal' };

  const renderScreen = () => {
    if (screen === 'login') return <LoginScreen dir={dir} setScreen={setScreen} theme={theme}/>;
    const props = { screen, setScreen, activeSample, setActiveSample };
    if (dir === 'A') return <DirectionA {...props}/>;
    if (dir === 'B') return <DirectionB {...props}/>;
    return <DirectionC {...props}/>;
  };

  return (
    <React.Fragment>
      <div className="direction-bar">
        <Ic.Flask style={{width:20,height:20, color:'#60a5fa'}}/>
        <span style={{fontWeight:700, letterSpacing:'-0.01em'}}>SampleDB redesign</span>
        <span className="direction-bar__label" style={{marginLeft: 8}}>Direction</span>
        <div className="direction-bar__segs">
          {['A','B','C'].map(k => (
            <button key={k} className={'direction-bar__seg' + (dir===k?' active':'')} onClick={()=>setDir(k)}>
              {k} · {directionLabels[k]}
            </button>
          ))}
        </div>
        <span style={{fontSize: 11, color: 'rgba(255,255,255,0.55)', marginLeft: 2, maxWidth: 220}}>{directionSubs[dir]}</span>
        <div className="direction-bar__screens">
          {SCREENS.map(([k,l]) => (
            <button key={k} className={screen===k?'active':''} onClick={()=>setScreen(k)}>{l}</button>
          ))}
        </div>
        <button className="direction-bar__theme" onClick={()=>setTheme(t=>t==='dark'?'light':'dark')}>
          {theme==='dark' ? <Ic.Sun style={{width:14,height:14}}/> : <Ic.Moon style={{width:14,height:14}}/>}
          {theme==='dark' ? 'Light' : 'Dark'}
        </button>
      </div>
      <div className="stage" data-dir={dir} data-theme={theme}>{renderScreen()}</div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

  </script>
</body>
