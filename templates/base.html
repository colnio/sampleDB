{{define "base"}}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{template "title" .}}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script>
    (function () {
        try {
            const storedTheme = localStorage.getItem('color-theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const initialTheme = storedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', initialTheme);
            document.documentElement.style.colorScheme = initialTheme === 'dark' ? 'dark' : 'light';
        } catch (err) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css" integrity="sha512-Ya9H+OPj8NgcQk34nCrbehaA0atbzGdZCI2uCbqVRELgnlrh8vQ2INMnkadVMSniC54HChLIh5htabVuKJww8g==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="/static/css/style.css?v=2">
    <link rel="stylesheet" href="/static/css/design.css?v=1">
    <link rel="stylesheet" href="/static/css/gallery.css">
    <script src="/static/js/htmx.min.js"></script>
    {{block "additional_styles" .}}{{end}}
</head>
<body hx-boost="true" hx-target="#page-root" hx-select="#page-root" hx-swap="innerHTML" hx-indicator="#page-indicator">
    <button type="button" class="sidebar__mobile-toggle" id="sidebar-toggle" aria-label="Toggle navigation" aria-controls="app-sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M4 6h16a1 1 0 010 2H4a1 1 0 110-2zm0 5h16a1 1 0 010 2H4a1 1 0 110-2zm0 5h16a1 1 0 010 2H4a1 1 0 110-2z"/>
        </svg>
    </button>
    <div class="sidebar-scrim" id="sidebar-scrim" aria-hidden="true"></div>
    <div class="app-shell">
        {{template "header" .}}
        <main id="page-root" class="app-main" role="main">
            <div id="notif-area" aria-live="polite"></div>
            {{template "content" .}}
        </main>
    </div>
    <div id="page-indicator" class="htmx-indicator" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span class="sr-only">Loading</span>
    </div>
    <script>
    (function () {
        document.body.addEventListener('htmx:afterSwap', function (evt) {
            var req = evt && evt.detail && evt.detail.requestConfig;
            if (req && req.boosted && !req.historyRestore) {
                window.scrollTo(0, 0);
            } else if (!req) {
                var tgt = evt && evt.detail && evt.detail.target;
                if (tgt && tgt.id === 'page-root') window.scrollTo(0, 0);
            }
        });
    })();
    </script>
    {{block "footer_scripts" .}}{{end}}
    <script>
    (function () {
        var STORAGE_KEY = 'sdb_dismissed_notifs';
        function getDismissed() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { return []; }
        }
        function addDismissed(id) {
            var d = getDismissed();
            if (d.indexOf(id) < 0) { d.push(id); }
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch(e) {}
        }
        var levelLabel = { info: 'Info', warning: 'Warning', critical: 'Critical' };
        function renderBanners(notifs) {
            var area = document.getElementById('notif-area');
            if (!area) return;
            var dismissed = getDismissed();
            var visible = notifs.filter(function(n) { return dismissed.indexOf(n.id) < 0; });
            if (!visible.length) { area.innerHTML = ''; return; }
            var html = '<div class="notif-stack">';
            visible.forEach(function(n) {
                var lbl = levelLabel[n.level] || n.level;
                var date = n.created_at ? new Date(n.created_at).toLocaleDateString(undefined, {month:'short', day:'numeric'}) : '';
                html += '<div class="notif-banner notif-banner--' + n.level + '" data-notif-id="' + n.id + '">' +
                    '<div class="notif-banner__bar"></div>' +
                    '<div class="notif-banner__body">' +
                        '<div class="notif-banner__head">' +
                            '<span class="notif-banner__level">' + lbl + '</span>' +
                            '<span class="notif-banner__msg">' + escHtml(n.message) + '</span>' +
                        '</div>' +
                        '<div class="notif-banner__meta">posted by ' + escHtml(n.author) + (date ? ' · ' + date : '') + '</div>' +
                    '</div>' +
                    '<button class="notif-banner__close" aria-label="Dismiss" data-dismiss="' + n.id + '">&times;</button>' +
                '</div>';
            });
            html += '</div>';
            area.innerHTML = html;
            area.querySelectorAll('[data-dismiss]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var id = parseInt(this.getAttribute('data-dismiss'), 10);
                    addDismissed(id);
                    var banner = area.querySelector('[data-notif-id="' + id + '"]');
                    if (banner) { banner.style.opacity = '0'; banner.style.transform = 'translateY(-4px)'; banner.style.transition = 'opacity 0.15s,transform 0.15s'; setTimeout(function() { banner.remove(); }, 160); }
                });
            });
        }
        function escHtml(s) {
            return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        function loadNotifications() {
            fetch('/api/notifications', { credentials: 'same-origin' })
                .then(function(r) { return r.ok ? r.json() : []; })
                .then(renderBanners)
                .catch(function() {});
        }
        document.addEventListener('DOMContentLoaded', loadNotifications);
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail && evt.detail.target && evt.detail.target.id === 'page-root') {
                loadNotifications();
            }
        });
    })();
    </script>
</body>
</html>
{{end}}
