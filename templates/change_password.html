{{define "title"}}Change Password{{end}}

{{define "content"}}
<div class="page-topbar">
    <div class="page-topbar__left">
        <h1>Change Password</h1>
        <div class="page-topbar__crumbs">Update the password on your account</div>
    </div>
</div>
<div class="account-page">
    <div class="card">
        {{with .Error}}
        <div class="alert alert-error">{{.}}</div>
        {{end}}
        {{with .Success}}
        <div class="alert alert-success">{{.}}</div>
        {{end}}

        <form method="POST" action="/change-password" class="form">
            <div class="form-group">
                <label for="current_password">Current password</label>
                <input type="password" id="current_password" name="current_password" required autocomplete="current-password">
            </div>
            <div class="form-group">
                <label for="new_password">New password</label>
                <input type="password" id="new_password" name="new_password" required autocomplete="new-password" minlength="8">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" minlength="8">
            </div>

            <div class="form-actions">
                <button type="submit" class="button button--primary">Update Password</button>
                <a href="/dashboard" class="button button--secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<style>
.account-page {
    max-width: 520px;
}

.account-page .card {
    padding: 24px;
}

.account-page .alert {
    margin-bottom: 16px;
}

.account-page .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
}

.account-page label {
    font-weight: 600;
    color: var(--neutral-700);
}

.account-page input[type="password"] {
    border: 1px solid var(--neutral-200);
    border-radius: 6px;
    padding: 10px;
    font-size: 1rem;
}

.account-page input[type="password"]:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

.account-page .form-actions {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    margin-top: 24px;
}

.account-page .button {
    min-width: 160px;
}

@media (max-width: 480px) {
    .account-page .form-actions {
        flex-direction: column-reverse;
    }
}
</style>
{{end}}
